name: Build MaoozOS Android 3.11.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MaoozOS 3.11.0 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -d app || {
            echo "ERROR: app/ folder not found at repository root."
            exit 1
          }

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found."
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          }

          echo "Project structure verified."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "ERROR: APK was not generated."
            exit 1
          }

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoozOS-Android-3.11.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
